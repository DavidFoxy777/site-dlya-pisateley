<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Ideogram">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E0397E"/><stop offset="1" stop-color="#7B4BFF"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#7B4BFF" stop-opacity=".60"/>
      <stop offset="1" stop-color="#7B4BFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#ffffff" stroke-opacity=".055"/>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="#0b0d10"/>
  <rect width="400" height="400" fill="url(#grid)"/>
  <circle cx="200" cy="196" r="188" fill="url(#bg)" opacity=".26"/>
  <circle cx="200" cy="196" r="132" fill="url(#halo)"/>
  <g transform="translate(200,196)">
    <rect x="-74" y="-58" width="148" height="116" rx="36" fill="none" stroke="#ffffff" stroke-width="17"/>
    <circle cx="0" cy="-22" r="17" fill="#ffffff"/>
    <rect x="-16" y="2" width="32" height="42" rx="16" fill="#ffffff"/>
  </g>
</svg>
